<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Crickit — the management platform for your cricket team: squad, staff, competitions, matches, live scoring and stats." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      // set theme before first paint to avoid a flash
      (function () {
        var t;
        try { t = localStorage.getItem('crickit-theme'); } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <style>
      /* Splash / loading screen — inline so it paints before JS loads */
      #splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; background: #f8f9fb; transition: opacity .45s ease, visibility .45s; font-family: 'Geist', system-ui, sans-serif; }
      [data-theme='dark'] #splash { background: #09090b; }
      #splash.hide { opacity: 0; visibility: hidden; }
      .sp-inner { display: grid; justify-items: center; gap: 22px; }
      .sp-mark { width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; background: linear-gradient(140deg, #3e5bd8, #6e56cf); box-shadow: 0 18px 40px -12px rgba(62,91,216,.55); animation: sp-pop .6s cubic-bezier(.2,.9,.3,1.2) both; }
      .sp-mark svg { animation: sp-spin 2.4s linear infinite; }
      .sp-name { font-size: 22px; font-weight: 600; letter-spacing: -0.03em; color: #0e1116; animation: sp-up .5s .15s both; }
      [data-theme='dark'] .sp-name { color: #ededf0; }
      .sp-sub { font-size: 13px; color: #8a909b; margin-top: -16px; animation: sp-up .5s .25s both; }
      .sp-bar { width: 180px; height: 3px; border-radius: 3px; background: rgba(127,127,140,.18); overflow: hidden; animation: sp-up .5s .3s both; }
      .sp-bar i { display: block; height: 100%; width: 40%; border-radius: 3px; background: linear-gradient(90deg, #3e5bd8, #6e56cf); animation: sp-load 1.1s ease-in-out infinite; }
      @keyframes sp-pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
      @keyframes sp-up { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }
      @keyframes sp-load { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
      @keyframes sp-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .sp-mark svg, .sp-bar i { animation: none; } }
    </style>
    <title>Crickit — Cricket Team Management</title>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading Crickit">
      <div class="sp-inner">
        <div class="sp-mark">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="7.5" stroke="#fff" stroke-width="1.8"/><path d="M7.2 8.6c3.1 1.5 6.5 1.5 9.6 0M7.2 15.4c3.1-1.5 6.5-1.5 9.6 0" stroke="#fff" stroke-opacity=".75" stroke-width="1.2" stroke-dasharray="1.4 1.6" stroke-linecap="round"/></svg>
        </div>
        <div class="sp-name">Crickit</div>
        <div class="sp-sub">Cricket Team Management</div>
        <div class="sp-bar"><i></i></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
